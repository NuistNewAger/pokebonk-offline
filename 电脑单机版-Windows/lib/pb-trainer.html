<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéBonk 修改器</title>
<style>
  body{margin:0;background:#0d0b18;color:#e9e6ff;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
  header{padding:20px 24px 0}
  header h1{margin:0;font-size:20px;color:#ffd75e}
  header p{margin:6px 0 0;color:#9b93c9;font-size:12.5px}
  .tip{max-width:420px;margin:18px auto 40px;padding:12px 16px;border:1px solid #332b5e;border-radius:10px;background:#14112688;color:#b9b2e6;font-size:12px}
  .tip b{color:#ffd75e}
  a{color:#8b7cf0}
</style>
</head>
<body>
<header>
  <h1>🛠 PokéBonk 修改器</h1>
  <p>本地存档与对局数值修改 · 仅用于你自己的离线单机版</p>
</header>
<div class="tip">
  <b>对局内数值</b>（宝可币、重随/跳过/放逐次数等）需要在<b>游戏页面里</b>改：
  回到游戏按 <b>F8</b>，或点右上角的“改”按钮。<br><br>
  这一页负责改<b>存档</b>：星尘、研究所等级、道具、图鉴。改完回到游戏按 F5 刷新即可看到。
</div>
<script src="/__pb/trainer.js?standalone=1"></script>
</body>
</html>
